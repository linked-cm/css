name: Publish

on:
  push:
    branches:
      - main
      - dev

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Publish Stable Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Author the changesets "Version Packages" PR as the org release App (not the default
      # GITHUB_TOKEN) so its CI runs without a manual "Approve and run" gate. Requires the org
      # App installed on this repo + org secrets RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          registry-url: "https://registry.npmjs.org"

      # `npm stage` landed in CLI 11.15.0; Node 22.16 ships npm 10.x, so the bundled one
      # cannot stage. Pinned rather than `@latest` so a future npm release cannot change how
      # releases behave without a commit here.
      - name: Use an npm that can stage
        run: npm i -g npm@^11.15.0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      # No `publish:` — changesets only opens/updates the version PR. `changeset publish`
      # shells out to `npm publish`, which a stage-only token cannot do
      # (changesets/changesets#2025 is open for first-class support).
      - name: Create release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Stage the stable release for a maintainer to approve with 2FA. Idempotent: this
      # workflow runs on every push to main, so it must do nothing when the version is
      # already published or already queued.
      - name: Stage the release for approval
        if: steps.changesets.outputs.hasChangesets != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry — nothing to do."; exit 0
          fi
          if npm stage list "$name" 2>/dev/null | grep -q "$version"; then
            echo "$name@$version is already staged and waiting for approval."; exit 0
          fi

          echo "Staging $name@$version…"
          npm stage publish --access public --provenance

          {
            echo "### 📦 \`$name@$version\` is staged, not published"
            echo
            echo "It is uploaded and held for review. **Approve it to make it public:**"
            echo
            echo "- **CLI:** \`npm stage approve $name@$version\`"
            echo "- **Web:** [npmjs.com](https://www.npmjs.com) → your avatar → **Staged"
            echo "  Packages** → **Approve**. The button stays disabled until npm has"
            echo "  finished scanning the tarball; the page refreshes every minute."
            echo
            echo "Both prompt for 2FA."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Approval needed::$name@$version is staged. Run: npm stage approve $name@$version — or approve it from Staged Packages in the npm user menu."

  backmerge-to-dev:
    # Full back-merge of main into dev after a release. Unlike a version-only sync, this also
    # carries the CHANGELOG and — critically — the changeset *deletions* the release made, so dev
    # never keeps already-released changesets that would otherwise re-release on the next dev->main.
    # Requires "Allow auto-merge" enabled on the repo for the PR to self-merge once checks pass.
    name: Back-merge main into dev
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Open & auto-merge back-merge PR (main -> dev)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git fetch origin main dev
          # Nothing to do when dev already contains main.
          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev already contains main — nothing to back-merge."
            exit 0
          fi
          # Reuse an existing open back-merge PR if present, else open one.
          pr=$(gh pr list --base dev --head main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            url=$(gh pr create --base dev --head main \
              --title "chore: back-merge main into dev (post-release sync)" \
              --body "Automated post-release back-merge: brings the version bump, CHANGELOG, and changeset deletions from main into dev so dev stays clean and a future dev->main never re-releases consumed changesets.")
            pr="${url##*/}"
            echo "Opened back-merge PR #$pr"
          else
            echo "Reusing existing back-merge PR #$pr"
          fi
          # Auto-merge once required checks pass (needs "Allow auto-merge" enabled on the repo).
          gh pr merge "$pr" --auto --merge \
            || echo "Auto-merge unavailable (disabled or conflicts) — PR #$pr left open for manual merge."

  dev-release:
    name: Publish Dev Release
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          registry-url: "https://registry.npmjs.org"

      # `npm stage` landed in CLI 11.15.0; Node 22.16 ships npm 10.x, so the bundled one
      # cannot stage. Pinned rather than `@latest` so a future npm release cannot change how
      # releases behave without a commit here.
      - name: Use an npm that can stage
        run: npm i -g npm@^11.15.0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Stage next prerelease for approval
        run: |
          # Start from main's version so changesets apply on top of the latest stable
          git fetch origin main --depth=1
          MAIN_VERSION=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          npm version "$MAIN_VERSION" --no-git-tag-version --allow-same-version
          # Apply pending changesets to get the next version
          npx changeset version
          NEXT_VERSION=$(node -p "require('./package.json').version")
          # Append dev prerelease identifier
          DEV_VERSION="${NEXT_VERSION}-next.$(date +%Y%m%d%H%M%S)"
          npm version "$DEV_VERSION" --no-git-tag-version
          # Staged, like the stable release — a prerelease is still installable code, and the
          # token cannot publish directly either way.
          #
          # NOTE: this means every push to `dev` queues a prerelease for manual approval. If
          # that becomes noise, the honest fix is to stop cutting a prerelease per push —
          # move this job to `workflow_dispatch` — rather than to weaken the gate.
          npm stage publish --tag next --access public --provenance
          echo "::notice title=Approval needed::$DEV_VERSION is staged. Run: npm stage approve $(node -p "require('./package.json').name")@$DEV_VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
